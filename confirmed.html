<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You are on the list - WET VST</title>
    <meta name="description" content="Your address is confirmed for WET release notices.">
    <meta name="robots" content="noindex">
    <link rel="icon" href="data:,">
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #141414;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent: #3b82f6;
            --border: #2a2a2a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 1.5rem;
        }
        .container { max-width: 34rem; }
        h1 { font-size: 1.9rem; margin-bottom: 1rem; }
        p { color: var(--text-secondary); margin-bottom: 1rem; }
        strong { color: var(--text-primary); font-weight: 600; }
        a { color: var(--accent); }
        .note {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1.25rem 1.5rem;
            margin: 1.75rem 0;
        }
        .note p:last-child { margin-bottom: 0; }
        .back { font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>You are on the list.</h1>
        <p>Your address is confirmed. You will hear from me when a WET plugin is <strong>released or updated</strong>.</p>
        <div class="note">
            <p>Every email has an unsubscribe link.</p>
        </div>
        <p>Four free plugins are ready to download now, and WetChorus and WetWeld are on the way.</p>
        <p class="back"><a href="/">Back to WET VST</a></p>
    </div>
</body>
</html>
